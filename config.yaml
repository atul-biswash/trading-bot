# ===========================================================================
# Non-secret runtime configuration.
# Secrets (API keys, Telegram token) belong in .env, never here.
# This file is parsed into typed pydantic models (see src/trading_bot/config).
# ===========================================================================

# Execution mode. SAFE DEFAULT = testnet.
#   testnet  -> real Binance API, fake money (Binance Spot Testnet)
#   live     -> real Binance API, REAL money
#   paper    -> local simulator, live prices, no orders sent
#   backtest -> historical replay, no live connection
mode: testnet

exchange:
  name: binance
  recv_window_ms: 5000        # Binance signed-request receive window
  requests_timeout_s: 10
  rate_limit_safety: 0.9      # use at most 90% of the reported rate limit

trading:
  base_currency: USDT
  default_timeframe: 1m
  pairs:
    - symbol: BTCUSDT
      timeframe: 1m
      enabled: true
    - symbol: ETHUSDT
      timeframe: 5m
      enabled: true

data:
  # Market-data provider (see data/market_data.py). At startup each enabled pair
  # is seeded with `history_limit` closed candles over REST so strategies are
  # warm immediately; the live WebSocket then appends each newly closed bar.
  history_limit: 500          # candles fetched per pair at startup (Binance max: 1000/call)
  buffer_size: 1000           # rolling in-memory bars per pair; must be >= history_limit
                              # (~0.75 MB per pair at 1000 bars)

strategy:
  name: sma_crossover        # must match a name in the strategy registry
  params:
    fast_period: 20
    slow_period: 50

risk:
  # Values marked (exact) are parsed as Decimal, not float: 0.02 means exactly
  # 2/100, never 0.02000000000000000041. They are multiplied by account equity,
  # so the distinction is real money. Write them as plain decimals.
  position_sizing:
    method: fixed_fraction    # fixed_fraction | fixed_amount | risk_per_trade
    fraction: 0.02            # (exact) 2% of equity per position (fixed_fraction)
    fixed_amount: 100.0       # (exact) quote units per position (fixed_amount)
    risk_per_trade: 0.01      # (exact) 1% of equity risked, sized from stop distance
  stop_loss:
    enabled: true
    type: percent             # percent | atr
    percent: 2.0
    atr_period: 14
    atr_multiplier: 2.0
  take_profit:
    enabled: true
    type: percent             # percent | rr (risk/reward multiple of stop)
    percent: 4.0
    rr_multiple: 2.0
  trailing_stop:
    enabled: false
    activation_percent: 1.0   # profit needed before the trail activates
    trail_percent: 1.0        # distance the stop trails behind price
  limits:
    max_open_positions: 3
    max_daily_loss_percent: 5.0     # halt new entries after this daily drawdown
    max_position_size_percent: 20.0 # (exact) cap any single position vs. equity
    cooldown_minutes: 15            # per-symbol pause after a stop-out

  # The M5 safety numbers. STATUS IS PART OF EACH VALUE: five of the six numbers
  # in docs/M5_NUMBERS.md are PLACEHOLDER -- NOT MEASURED, meaning a rationale
  # with no sample behind it. Do not quote one as though it were measured, and
  # do not ship any of them to LIVE without its measurement.
  max_entry_slippage: 0.001         # (exact) 0.1%, a FRACTION not a percent.
                                    # PLACEHOLDER -- NOT MEASURED. The real value
                                    # is a quantile of close-to-ask distance; no
                                    # sample exists. Bounded above at 0.05, which
                                    # is a ceiling on absurdity rather than a
                                    # supported range: near it, the price is
                                    # itself band-refusable and the WHOLE order
                                    # list dies, entry and both protective legs.
  price_band_margin: 0.02           # (exact) safety margin on PERCENT_PRICE_BY_SIDE.
                                    # PLACEHOLDER -- NOT MEASURED, and blocked
                                    # behind a prior question: whether avgPrice
                                    # reports the series the filter judges against.
                                    # Deliberately small -- the exchange is the
                                    # authority, this only saves a round trip.
  max_position_staleness_s: 180.0   # PLACEHOLDER -- NOT MEASURED. 3x the shortest
                                    # enabled timeframe ON THIS PAIR LIST; a policy
                                    # choice, not a derivation. Lengthen your
                                    # shortest bar and RAISE THIS BY HAND -- nothing
                                    # checks it, and a value that fires on a healthy
                                    # system trains you to ignore the line.
  dispatch_deadline_s: 9.0          # PLACEHOLDER -- NOT MEASURED. Bounds the WHOLE
                                    # dispatch sequence, worst case a three-call
                                    # CLOSE. The per-call share is DERIVED (~3.0s),
                                    # never set here. Not exchange.requests_timeout_s:
                                    # a three-call CLOSE at that 10s would be 30s.
  reconcile_deadline_s: 3.0         # PLACEHOLDER -- NOT MEASURED. One order-list
                                    # query, so a slow read cannot starve the pass.

backtesting:
  start_date: "2024-01-01"
  end_date: "2024-06-30"
  initial_balance: 10000.0
  fee_percent: 0.1
  slippage_percent: 0.05
  data_dir: data/historical

paper_trading:
  initial_balance: 10000.0
  fee_percent: 0.1
  slippage_percent: 0.05

notifications:
  telegram:
    enabled: false            # token/chat_id come from .env
    notify_on:
      - signal
      - trade
      - error
      - daily_summary

logging:
  level: INFO
  console: true
  file:
    enabled: true
    path: logs/trading_bot.log
    max_bytes: 10485760       # 10 MB
    backup_count: 5
    json: false               # true -> structured JSON lines

database:
  # SQLite for now. To upgrade later, change this URL (e.g. to a Postgres DSN)
  # and the SQLAlchemy models keep working.
  url: sqlite:///data/trading_bot.db
  echo: false

engine:
  loop_interval_s: 1.0
  # WebSocket auto-reconnection (see exchange/websocket_client.py).
  # 0 = retry forever (recommended for 24/7 operation). A positive value caps
  # consecutive failed reconnects; the counter resets after any healthy message.
  reconnect_max_retries: 0
  reconnect_backoff_s: 5.0        # base backoff (s); grows exponentially per retry
  reconnect_backoff_max_s: 60.0   # backoff ceiling (s); jitter applied under it
  # Consecutive strategy failures tolerated per pair before that pair is
  # quarantined (no further evaluation until restart). 0 = never quarantine.
  max_strategy_errors: 5
